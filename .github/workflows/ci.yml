name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests fastapi uvicorn sympy pytest httpx

      - name: Run tests
        run: python -m pytest -q

      - name: Run offline demo
        run: python examples/demo.py > /dev/null

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check --manifest-path rust/Cargo.toml

      - name: Lint
        run: cargo clippy --all-targets --manifest-path rust/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path rust/Cargo.toml
