name: Nightly eval

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests fastapi uvicorn sympy pytest httpx

      - name: Run scenario evals
        run: python -m botropolis.eval.runner
