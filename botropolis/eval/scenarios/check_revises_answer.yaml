name: check_revises_answer
description: The agent answers 6 times 7 wrong, then the check pass catches the error and the corrected answer is what the run returns.
toolkit: [calculator]
task: What is 6 times 7?
replies:
  - "FINAL: {\"summary\": \"6 times 7 is 43.\", \"details\": \"\", \"key_points\": []}"
  - "FINAL: {\"summary\": \"6 times 7 is 42.\", \"details\": \"The first draft was wrong, so I fixed it.\", \"key_points\": [\"6 times 7 is 42\"]}"
expect:
  output_equals: |
    6 times 7 is 42.

    The first draft was wrong, so I fixed it.
