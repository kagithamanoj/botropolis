name: tool_failure_adapts
description: The first calculation fails (division by zero). The agent adapts, runs the fallback calculation, and reports honestly what failed and what it did instead.
toolkit: [calculator]
task: What is 100 divided by (5 minus 5)? If that cannot be done, divide 100 by 4 instead and explain what happened.
replies:
  - 'ACTION: {"tool": "calculator", "args": {"expression": "100 / (5 - 5)"}}'
  - 'ACTION: {"tool": "calculator", "args": {"expression": "100 / 4"}}'
  - "FINAL: {\"summary\": \"The first calculation failed: 100 divided by (5 minus 5) is division by zero, which has no answer. As instructed, I fell back to 100 divided by 4, which is 25.\", \"details\": \"calculator reported ZeroDivisionError on the first call; the second call succeeded.\", \"key_points\": [\"first attempt: division by zero, failed\", \"fallback: 100 / 4 = 25\"]}"
expect:
  output_contains: "25"
  tool_call_count: 2
  tool_calls:
    - tool: calculator
      args: {expression: "100 / (5 - 5)"}
      success: false
    - tool: calculator
      args: {expression: "100 / 4"}
      success: true
