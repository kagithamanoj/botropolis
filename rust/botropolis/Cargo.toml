[package]
name = "botropolis"
version = "0.1.0"
edition = "2021"
description = "Botropolis: a company of bots, in Rust. Same agent specs, same tools, same run formats as the Python side."
license = "MIT"

[[bin]]
name = "botropolis"
path = "src/main.rs"

[lib]
name = "botropolis"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
